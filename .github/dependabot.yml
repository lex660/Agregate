# Обновления зависимостей. Мелкие обновления (minor/patch) приходят одним PR в неделю,
# крупные (major) — отдельными PR, их стоит смотреть внимательнее.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
